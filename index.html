<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Crater Command</title>
    <style>
      html,
      body {
        margin: 0;
        min-height: 100%;
        background: #000;
        overflow: hidden;
      }

      body {
        display: grid;
        place-items: center;
      }

      canvas {
        width: min(100vw, 177.78vh, 960px);
        height: auto;
        image-rendering: pixelated;
        outline: none;
      }

      #visual-toggle {
        position: fixed;
        top: 10px;
        right: 10px;
        z-index: 10;
        border: 2px solid #a8a8a8;
        background: #050505;
        color: #ffef32;
        font: bold 12px "Courier New", monospace;
        padding: 6px 10px;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <button id="visual-toggle" type="button">Visual: Classic</button>
    <script type="module" src="/src/game/main.ts"></script>
  </body>
</html>
